name: ALIOUA BTP checks

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Generate initial migration for CI
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: "ci-only-not-a-production-secret-0123456789-abcdef-xyz"
          DJANGO_DEBUG: "1"
        run: python manage.py makemigrations core
      - name: Apply migrations and check project
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: "ci-only-not-a-production-secret-0123456789-abcdef-xyz"
          DJANGO_DEBUG: "1"
        run: |
          python manage.py migrate --noinput
          python manage.py check
      - name: Run tests
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: "ci-only-not-a-production-secret-0123456789-abcdef-xyz"
          DJANGO_DEBUG: "1"
        run: python manage.py test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web dependencies
        run: npm install
      - name: Build web app
        run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Analyze Flutter code
        run: flutter analyze
      - name: Generate Android project files
        run: flutter create --platforms=android .
      - name: Align Kotlin plugin with mobile_scanner
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          settings = Path("android/settings.gradle")
          source = settings.read_text()
          source, count = re.subn(
              r'(id\\s+["\\']org\\.jetbrains\\.kotlin\\.android["\\']\\s+version\\s+["\\'])[0-9.]+(["\\'])',
              r'\\g<1>2.1.0\\2',
              source,
          )
          if count == 0:
              raise SystemExit("Kotlin Android plugin declaration was not found in android/settings.gradle")
          settings.write_text(source)
          print("Updated Kotlin plugin to 2.1.0")
          print("\\n".join(line for line in source.splitlines() if "kotlin.android" in line))
          PY
      - name: Build release APK
        run: flutter build apk --release --dart-define=API_BASE=http://127.0.0.1:8000/api
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alioua-btp-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
