services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost,backend"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/db.sqlite3:/app/db.sqlite3
      - ./backend/media:/app/media
  web:
    build: ./web
    environment:
      VITE_API_URL: "http://localhost:8000/api"
    ports:
      - "5173:5173"
    depends_on:
      - backend
