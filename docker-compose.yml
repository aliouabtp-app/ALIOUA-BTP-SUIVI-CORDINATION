services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/media:/app/media
  web:
    build: ./web
    environment:
      VITE_API_URL: "/api"
      API_PROXY_TARGET: "http://backend:8000"
    ports:
      - "5173:5173"
    depends_on:
      - backend
