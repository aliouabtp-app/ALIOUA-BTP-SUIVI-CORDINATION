services:
  backend:
    build:
      context: ./backend
      args:
        APP_COMMIT: "${APP_COMMIT:-}"
        APP_BUILD_DATE: "${APP_BUILD_DATE:-}"
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/media:/app/media
  web:
    build: ./web
    environment:
      VITE_API_URL: "/api"
      API_PROXY_TARGET: "http://backend:8000"
    ports:
      - "5173:5173"
    depends_on:
      - backend
